[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waves"
version = "0.1.0"
description = "Numerical methods for the 2D wave equation (finite differences + implicit theta-method time stepping)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["src"]
